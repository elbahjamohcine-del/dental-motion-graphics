name: Render video

# Generates the voice-over (ElevenLabs), renders the MP4 in the cloud and
# attaches it to the run as a downloadable artifact.
#  • Automatically on every push to main that changes the video sources.
#  • Manually: Actions tab → "Render video" → "Run workflow" (choose the id).
#
# Voice-over setup (Settings → Secrets and variables → Actions):
#  • secret   ELEVENLABS_API_KEY   your ElevenLabs API key
#  • variable (or secret) ELEVENLABS_VOICE_ID  the voice to use (or set voiceover.voiceId
#                                  in the video content file)
# New audio clips are committed back to the repository, so unchanged lines are
# never paid for twice.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "remotion.config.ts"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id to render (see src/videos/index.ts)"
        required: true
        default: "ExtractionDarija"

permissions:
  contents: write # to commit the generated voice-over

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSITION: ${{ github.event.inputs.composition || 'ExtractionDarija' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (used by the blank-frame check in npm test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install headless browser
        run: npx remotion browser ensure

      - name: Generate voice-over (ElevenLabs)
        if: env.ELEVENLABS_API_KEY != ''
        run: npm run voiceover

      - name: Warn when no voice-over is configured
        if: env.ELEVENLABS_API_KEY == ''
        run: echo "::warning::ELEVENLABS_API_KEY secret not set. The video is rendered with the existing voice-over clips only (see README → Voice-over)."

      - name: Commit new voice-over clips
        if: env.ELEVENLABS_API_KEY != ''
        run: |
          git add public/voiceover
          if git diff --cached --quiet; then
            echo "Voice-over unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update voice-over"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Test (typecheck, lint, smoke render)
        run: npm test

      - name: Render MP4
        run: |
          npx remotion render "$COMPOSITION" "out/$COMPOSITION.mp4"
          node scripts/normalize-audio.mjs "out/$COMPOSITION.mp4"

      - name: Render cover image
        run: npx remotion still "$COMPOSITION-Cover" "out/$COMPOSITION-cover.png"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPOSITION }}
          path: |
            out/*.mp4
            out/*-cover.png
          retention-days: 30
