name: Render video

# Renders the MP4 in the cloud (GitHub Actions) and attaches it to the run as
# a downloadable artifact.
#  • Automatically on every push to main that changes the video sources.
#  • Manually: Actions tab → "Render video" → "Run workflow" (choose the id).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "remotion.config.ts"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id to render (see src/videos/index.ts)"
        required: true
        default: "ExtractionTroisErreurs"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSITION: ${{ github.event.inputs.composition || 'ExtractionTroisErreurs' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless browser
        run: npx remotion browser ensure

      - name: Test (typecheck, lint, smoke render)
        run: npm test

      - name: Render MP4
        run: npx remotion render "$COMPOSITION" "out/$COMPOSITION.mp4"

      - name: Render cover image
        run: npx remotion still "$COMPOSITION-Cover" "out/$COMPOSITION-cover.png"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPOSITION }}
          path: |
            out/*.mp4
            out/*-cover.png
          retention-days: 30
